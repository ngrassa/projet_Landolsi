# Restauration de la sauvegarde chiffrée landolsi_tires.dump.gpg.
# L'archive N'EST PAS dans ce dépôt public : elle est téléchargée depuis un
# emplacement privé (DB_BACKUP_URL) puis comparée à la somme de référence
# versionnée dans db/backup/landolsi_tires.dump.gpg.sha256.
#
# - verify (automatique à chaque modification de la sauvegarde, ou manuel) :
#   restaure dans un PostgreSQL 16 éphémère et contrôle les comptages. Sans effet sur la production.
# - restore-ec2 (manuel uniquement, target = ec2 et confirmation "RESTAURER") :
#   sauvegarde la base du serveur, arrête l'API, restaure, redémarre et vérifie /health.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   DB_BACKUP_URL         URL HTTPS de l'archive chiffrée (dépôt GitHub privé, S3...) (les deux jobs)
#   DB_BACKUP_TOKEN       facultatif : jeton envoyé en "Authorization: Bearer" (dépôt privé)
#   DB_BACKUP_PASSPHRASE  phrase secrète GPG de l'archive (les deux jobs)
#   EC2_HOST              IP ou nom de l'instance (restore-ec2)
#   EC2_SSH_KEY           clé privée SSH de l'utilisateur ubuntu (restore-ec2)
#   EC2_KNOWN_HOSTS       ligne(s) known_hosts de l'instance : ssh-keyscan -t ed25519 <IP> (restore-ec2)
# Le Security Group doit autoriser SSH depuis les runners GitHub pendant l'exécution
# (par défaut SSH est limité à l'IP de l'administrateur).

name: Restauration base de données

on:
  push:
    branches: [master]
    paths:
      - db/backup/**   # sommes de référence : modifiées à chaque nouvelle sauvegarde
      - scripts/restore-db.sh
      - scripts/restore-encrypted-backup.sh
      - .github/workflows/db-restore.yml
  workflow_dispatch:
    inputs:
      target:
        description: "verify = test sur PostgreSQL éphémère ; ec2 = restauration sur le serveur (destructif)"
        type: choice
        options: [verify, ec2]
        default: verify
      confirm:
        description: 'Pour target = ec2 : saisir "RESTAURER"'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: db-restore
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: landolsi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U landolsi" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Client PostgreSQL 16
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: Télécharger l'archive chiffrée
        env:
          DB_BACKUP_URL: ${{ secrets.DB_BACKUP_URL }}
          DB_BACKUP_TOKEN: ${{ secrets.DB_BACKUP_TOKEN }}
        run: |
          [ -n "$DB_BACKUP_URL" ] || { echo "::error::secret DB_BACKUP_URL absent"; exit 1; }
          auth=()
          [ -z "$DB_BACKUP_TOKEN" ] || auth=(-H "Authorization: Bearer $DB_BACKUP_TOKEN")
          curl -fsSL --retry 3 "${auth[@]}" -o "$RUNNER_TEMP/landolsi_tires.dump.gpg" "$DB_BACKUP_URL"
          echo "DB_BACKUP_ARCHIVE=$RUNNER_TEMP/landolsi_tires.dump.gpg" >> "$GITHUB_ENV"

      - name: Restaurer dans une base éphémère
        env:
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DB_BACKUP_PASSPHRASE" ] || { echo "::error::secret DB_BACKUP_PASSPHRASE absent"; exit 1; }
          umask 077
          cat > "$RUNNER_TEMP/ci.env" <<'EOF'
          DB_NAME=landolsi_tires
          DB_USER=landolsi
          DB_PASSWORD=ci-only-password
          DB_HOST=127.0.0.1
          DB_PORT=5432
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/ci.env"
          scripts/restore-encrypted-backup.sh -- \
            --target-db landolsi_tires --create --env-file "$RUNNER_TEMP/ci.env"

      - name: Contrôler les comptages
        env:
          PGHOST: 127.0.0.1
          PGUSER: landolsi
          PGPASSWORD: ci-only-password
          PGDATABASE: landolsi_tires
        run: |
          psql -v ON_ERROR_STOP=1 -c 'SELECT (SELECT count(*) FROM users) users, (SELECT count(*) FROM "Marques") marques,
            (SELECT count(*) FROM "Pneus") pneus, (SELECT count(*) FROM commandes) commandes,
            (SELECT count(*) FROM factures) factures, (SELECT count(*) FROM avis) avis'
          test "$(psql -At -c 'SELECT count(*) FROM users WHERE role = $$admin$$')" -ge 1
          test "$(psql -At -c 'SELECT count(*) FROM "Pneus"')" -ge 1

  restore-ec2:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'ec2' && inputs.confirm == 'RESTAURER'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger l'archive chiffrée
        env:
          DB_BACKUP_URL: ${{ secrets.DB_BACKUP_URL }}
          DB_BACKUP_TOKEN: ${{ secrets.DB_BACKUP_TOKEN }}
        run: |
          [ -n "$DB_BACKUP_URL" ] || { echo "::error::secret DB_BACKUP_URL absent"; exit 1; }
          auth=()
          [ -z "$DB_BACKUP_TOKEN" ] || auth=(-H "Authorization: Bearer $DB_BACKUP_TOKEN")
          curl -fsSL --retry 3 "${auth[@]}" -o "$RUNNER_TEMP/landolsi_tires.dump.gpg" "$DB_BACKUP_URL"
          echo "DB_BACKUP_ARCHIVE=$RUNNER_TEMP/landolsi_tires.dump.gpg" >> "$GITHUB_ENV"

      - name: Déchiffrer l'archive
        env:
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: scripts/restore-encrypted-backup.sh --decrypt-only "$RUNNER_TEMP/landolsi_tires.dump"

      - name: Configurer SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          [ -n "$EC2_SSH_KEY" ] && [ -n "$EC2_KNOWN_HOSTS" ] || { echo "::error::secrets EC2_SSH_KEY / EC2_KNOWN_HOSTS absents"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2 && chmod 600 ~/.ssh/id_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Restaurer sur l'instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_ec2 -o BatchMode=yes -o ConnectTimeout=20"
          scp -i ~/.ssh/id_ec2 -o BatchMode=yes "$RUNNER_TEMP"/landolsi_tires.dump{,.sha256} "ubuntu@$EC2_HOST:/tmp/"
          $SSH "ubuntu@$EC2_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          D=/var/backups/landolsi/ci_restore_$(date -u +%Y%m%dT%H%M%SZ).dump
          sudo install -o landolsi -g landolsi -m 600 /tmp/landolsi_tires.dump "$D"
          sudo install -o landolsi -g landolsi -m 600 /tmp/landolsi_tires.dump.sha256 "$D.sha256"
          sudo sed -i "s/landolsi_tires.dump\$/$(basename "$D")/" "$D.sha256"
          rm -f /tmp/landolsi_tires.dump /tmp/landolsi_tires.dump.sha256
          sudo -u landolsi /opt/landolsi/current/scripts/backup-db.sh
          sudo systemctl stop landolsi-backend
          trap 'sudo systemctl start landolsi-backend' EXIT
          sudo -u landolsi /opt/landolsi/current/scripts/restore-db.sh \
            --env-file /etc/landolsi/backend.env --file "$D" --target-db landolsi_tires --allow-nonempty
          sudo systemctl start landolsi-backend
          trap - EXIT
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:5001/health && exit 0; sleep 2; done
          echo "API non disponible après restauration" >&2; exit 1
          EOF

      - name: Nettoyer
        if: always()
        run: rm -f ~/.ssh/id_ec2 "$RUNNER_TEMP"/landolsi_tires.dump*
