# =============================================================================
# LANDOLSI TIRES — Pipeline « Destroy » : chemin inverse du déploiement
# =============================================================================
# Bouton : Actions > « Destroy — infrastructure AWS » > Run workflow, saisir DESTROY.
#
#   D1 Vérifications   confirmation, identifiants AWS, lecture de l'état Terraform (S3)
#   D2 Sauvegarde      pg_dump sur le serveur + instantané EBS du volume racine
#                      (+ archive chiffrée GPG téléchargeable si DB_BACKUP_PASSPHRASE existe)
#   D3 Destruction     terraform plan -destroy (affiché) puis terraform destroy :
#                      instance EC2, association de l'IP élastique, règles du Security Group
#   D4 Nettoyage       règles SSH temporaires, volume racine et IP élastique (sur option)
#   D5 Rapport         ce qui a été supprimé et ce qui est conservé
#
# Conservé par défaut (redéploiement à l'identique par le pipeline CI/CD) :
#   - l'IP élastique (même URL https://landolsi-tires-<ip>.sslip.io) ;
#   - le Security Group (créé hors Terraform, gratuit) ;
#   - le bucket S3 de l'état Terraform (état vide après destruction) ;
#   - le volume racine (base PostgreSQL) sauf si delete_root_volume est coché.
# =============================================================================

name: "Destroy — infrastructure AWS"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Saisir DESTROY pour confirmer la destruction de la VM'
        required: true
        default: ""
      backup:
        description: "Sauvegarder la base avant destruction (pg_dump + instantané EBS)"
        type: boolean
        default: true
      delete_root_volume:
        description: "Supprimer aussi le volume racine (données) après l'instantané"
        type: boolean
        default: false
      release_eip:
        description: "Libérer l'IP élastique (l'URL du site changera au prochain déploiement)"
        type: boolean
        default: false

permissions:
  contents: read

# Même groupe que les jobs AWS du pipeline CI/CD : jamais de déploiement et de
# destruction simultanés sur la même infrastructure.
concurrency:
  group: aws-infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.7"
  PROJECT: landolsi-tires
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  preflight:
    name: "D1 Vérifications (confirmation, AWS, état Terraform)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_instance: ${{ steps.state.outputs.has_instance }}
      instance_id: ${{ steps.state.outputs.instance_id }}
      public_ip: ${{ steps.state.outputs.public_ip }}
      root_volume_id: ${{ steps.state.outputs.root_volume_id }}
      sg_id: ${{ steps.state.outputs.sg_id }}
      eip_alloc: ${{ steps.state.outputs.eip_alloc }}
    steps:
      - name: Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != DESTROY ]; then
            echo "::error::Confirmation invalide : saisir exactement DESTROY."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Connexion AWS
        id: aws
        uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TF_VERSION }}
          project: ${{ env.PROJECT }}
          init: "false"

      - name: État Terraform présent ?
        env:
          BUCKET: ${{ steps.aws.outputs.state-bucket }}
        run: |
          if ! aws s3api head-object --bucket "$BUCKET" --key "$PROJECT/terraform.tfstate" >/dev/null 2>&1; then
            echo "::error::Aucun état Terraform dans s3://$BUCKET/$PROJECT/ : rien n'a été déployé par le pipeline (ou le lab a été réinitialisé)."
            exit 1
          fi

      - name: terraform init
        uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TF_VERSION }}
          project: ${{ env.PROJECT }}

      - name: Ressources gérées par Terraform
        id: state
        working-directory: infra/aws
        env:
          BUCKET: ${{ steps.aws.outputs.state-bucket }}
        run: |
          aws s3 cp "s3://$BUCKET/$PROJECT/ci.auto.tfvars.json" ci.auto.tfvars.json --only-show-errors
          resources=$(terraform state list)
          {
            echo "## D1 Ressources présentes dans l'état Terraform"
            echo '```'
            echo "${resources:-(aucune)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sg_id=$(jq -r .security_group_id ci.auto.tfvars.json)" >> "$GITHUB_OUTPUT"
          echo "eip_alloc=$(jq -r .eip_allocation_id ci.auto.tfvars.json)" >> "$GITHUB_OUTPUT"
          if grep -qx aws_instance.app <<<"$resources"; then
            terraform output -json > outputs.json
            {
              echo "has_instance=true"
              echo "instance_id=$(jq -r .instance_id.value outputs.json)"
              echo "public_ip=$(jq -r .public_ip.value outputs.json)"
              echo "root_volume_id=$(jq -r '.root_volume_id.value // empty' outputs.json)"
            } >> "$GITHUB_OUTPUT"
            echo "Instance : $(jq -r .instance_id.value outputs.json) ($(jq -r .public_ip.value outputs.json))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_instance=false" >> "$GITHUB_OUTPUT"
          fi

  backup:
    name: "D2 Sauvegarde avant destruction"
    needs: preflight
    if: inputs.backup && needs.preflight.outputs.has_instance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EC2_HOST: ${{ needs.preflight.outputs.public_ip }}
      INSTANCE_ID: ${{ needs.preflight.outputs.instance_id }}
      SG_ID: ${{ needs.preflight.outputs.sg_id }}
      ROOT_VOLUME_ID: ${{ needs.preflight.outputs.root_volume_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Connexion AWS
        uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TF_VERSION }}
          project: ${{ env.PROJECT }}
          init: "false"

      - name: Ouvrir SSH pour ce runner uniquement
        run: .github/scripts/sg-ssh.sh open

      - name: Connexion SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: .github/scripts/ssh-setup.sh

      - name: pg_dump sur le serveur (backup-db.sh, archive + SHA-256 dans /var/backups/landolsi)
        run: |
          ssh ec2 'sudo -u landolsi /opt/landolsi/current/scripts/backup-db.sh'
          dump=$(ssh ec2 'sudo ls -1t /var/backups/landolsi/*.dump | head -1')
          echo "DUMP=$dump" >> "$GITHUB_ENV"
          {
            echo "## D2 Sauvegarde"
            echo "- Archive sur le volume racine : \`$dump\`"
            echo '```'
            ssh ec2 'sudo -u postgres psql -XAtd landolsi_tires' <<'SQL' || true
          SELECT 'utilisateurs = ' || count(*) FROM users
          UNION ALL SELECT 'pneus = ' || count(*) FROM "Pneus"
          UNION ALL SELECT 'commandes = ' || count(*) FROM commandes;
          SQL
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instantané EBS du volume racine (base, images, sauvegardes)
        id: snap
        continue-on-error: true
        run: |
          [ -n "$ROOT_VOLUME_ID" ] || ROOT_VOLUME_ID=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].BlockDeviceMappings[0].Ebs.VolumeId' --output text)
          ssh ec2 'sync'
          snap=$(aws ec2 create-snapshot --volume-id "$ROOT_VOLUME_ID" \
            --description "landolsi-tires avant destroy (run ${GITHUB_RUN_ID})" \
            --tag-specifications "ResourceType=snapshot,Tags=[{Key=Name,Value=${PROJECT}-predestroy-${GITHUB_RUN_ID}},{Key=Project,Value=${PROJECT}}]" \
            --query SnapshotId --output text)
          echo "snapshot_id=$snap" >> "$GITHUB_OUTPUT"
          echo "- Instantané EBS : \`$snap\` (volume \`$ROOT_VOLUME_ID\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive chiffrée téléchargeable (si DB_BACKUP_PASSPHRASE existe)
        id: artifact
        env:
          DB_BACKUP_PASSPHRASE: ${{ secrets.DB_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_BACKUP_PASSPHRASE" ]; then
            echo "::notice::DB_BACKUP_PASSPHRASE absent : pas d'archive téléchargeable (le dépôt est public, aucune donnée n'est publiée en clair)."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          mkdir -p backup
          ssh ec2 "sudo cat '$DUMP'" > backup/landolsi_tires.dump
          ssh ec2 'sudo tar czf - -C /var/lib/landolsi uploads' > backup/uploads.tar.gz
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          (cd backup && sha256sum landolsi_tires.dump uploads.tar.gz > "SHA256SUMS_${ts}.txt")
          for f in landolsi_tires.dump uploads.tar.gz; do
            printf '%s' "$DB_BACKUP_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 -o "backup/${f%%.*}_${ts}.${f#*.}.gpg" "backup/$f"
            rm -f "backup/$f"
          done
          ls -l backup
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "- Archive chiffrée (GPG AES-256) : artefact \`backup-predestroy-${ts}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "TS=$ts" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: steps.artifact.outputs.created == 'true'
        with:
          name: backup-predestroy-${{ env.TS }}
          path: backup/
          retention-days: 30

      - name: Attendre la fin de l'instantané (si le volume doit être supprimé)
        if: inputs.delete_root_volume && steps.snap.outputs.snapshot_id != ''
        env:
          SNAP: ${{ steps.snap.outputs.snapshot_id }}
        run: |
          aws ec2 wait snapshot-completed --snapshot-ids "$SNAP"
          echo "Instantané $SNAP terminé."

      - name: Une sauvegarde hors volume existe-t-elle ? (requis pour supprimer le volume)
        if: inputs.delete_root_volume
        env:
          SNAP: ${{ steps.snap.outputs.snapshot_id }}
          ART: ${{ steps.artifact.outputs.created }}
        run: |
          if [ -z "$SNAP" ] && [ "$ART" != true ]; then
            echo "::error::Ni instantané EBS ni archive chiffrée : suppression du volume refusée (les données seraient perdues)."
            exit 1
          fi

      - name: Refermer SSH
        if: always()
        run: |
          .github/scripts/sg-ssh.sh close || true
          rm -rf ~/.ssh/id_ec2 ~/.ssh/config backup

  destroy:
    name: "D3 terraform destroy (suppression de la VM)"
    needs: [preflight, backup]
    # Sauvegarde réussie, ou non demandée / sans objet (aucune instance)
    if: always() && needs.preflight.result == 'success' && (needs.backup.result == 'success' || needs.backup.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v7

      - name: Connexion AWS + terraform init
        id: aws
        uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TF_VERSION }}
          project: ${{ env.PROJECT }}

      - name: Variables Terraform
        env:
          BUCKET: ${{ steps.aws.outputs.state-bucket }}
        run: aws s3 cp "s3://$BUCKET/$PROJECT/ci.auto.tfvars.json" ci.auto.tfvars.json --only-show-errors

      - name: terraform plan -destroy (ce qui va être supprimé)
        run: |
          terraform plan -destroy -input=false -no-color -out=destroy.tfplan | tee plan.txt
          terraform show -json destroy.tfplan > plan.json
          {
            echo "## D3 Destruction Terraform"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
            echo "| Action | Ressource |"
            echo "|---|---|"
            jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "| \(.change.actions | join("/")) | \(.address) |"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform destroy
        run: terraform apply -input=false -no-color -auto-approve destroy.tfplan

      - name: Vérifier la terminaison de l'instance
        env:
          INSTANCE_ID: ${{ needs.preflight.outputs.instance_id }}
        run: |
          if [ -n "$INSTANCE_ID" ]; then
            aws ec2 wait instance-terminated --instance-ids "$INSTANCE_ID"
            echo "Instance $INSTANCE_ID : terminated" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          left=$(terraform state list | wc -l)
          echo "Ressources restantes dans l'état : $left" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$left" -eq 0 ]

  cleanup:
    name: "D4 Nettoyage (SSH temporaire, volume, IP élastique)"
    needs: [preflight, destroy]
    if: always() && needs.destroy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SG_ID: ${{ needs.preflight.outputs.sg_id }}
      ROOT_VOLUME_ID: ${{ needs.preflight.outputs.root_volume_id }}
      EIP_ALLOC: ${{ needs.preflight.outputs.eip_alloc }}
    steps:
      - uses: actions/checkout@v7

      - name: Connexion AWS
        uses: ./.github/actions/terraform-init
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          terraform-version: ${{ env.TF_VERSION }}
          project: ${{ env.PROJECT }}
          init: "false"

      - name: Règles SSH temporaires restantes
        run: |
          if [ -n "$SG_ID" ] && aws ec2 describe-security-groups --group-ids "$SG_ID" >/dev/null 2>&1; then
            .github/scripts/sg-ssh.sh purge
          fi

      - name: Volume racine
        env:
          DELETE: ${{ inputs.delete_root_volume }}
        run: |
          echo "## D4 Nettoyage" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$ROOT_VOLUME_ID" ] || ! aws ec2 describe-volumes --volume-ids "$ROOT_VOLUME_ID" >/dev/null 2>&1; then
            echo "- Volume racine : déjà supprimé" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          aws ec2 wait volume-available --volume-ids "$ROOT_VOLUME_ID"
          if [ "$DELETE" = true ]; then
            aws ec2 delete-volume --volume-id "$ROOT_VOLUME_ID"
            echo "- Volume racine \`$ROOT_VOLUME_ID\` : **supprimé** (instantané conservé)" >> "$GITHUB_STEP_SUMMARY"
          else
            aws ec2 create-tags --resources "$ROOT_VOLUME_ID" \
              --tags "Key=Name,Value=${PROJECT}-root-detached" "Key=Project,Value=${PROJECT}" || true
            echo "- Volume racine \`$ROOT_VOLUME_ID\` : conservé, détaché (≈ 1,6 \$/mois pour 20 Go gp3)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: IP élastique
        env:
          RELEASE: ${{ inputs.release_eip }}
        run: |
          if [ -z "$EIP_ALLOC" ] || ! aws ec2 describe-addresses --allocation-ids "$EIP_ALLOC" >/dev/null 2>&1; then
            echo "- IP élastique : aucune" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ip=$(aws ec2 describe-addresses --allocation-ids "$EIP_ALLOC" --query 'Addresses[0].PublicIp' --output text)
          if [ "$RELEASE" = true ]; then
            aws ec2 release-address --allocation-id "$EIP_ALLOC"
            echo "- IP élastique \`$ip\` : **libérée** (nouvelle URL au prochain déploiement)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- IP élastique \`$ip\` : conservée → même URL au prochain déploiement" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Volumes orphelins du projet (information)
        run: |
          {
            echo
            echo "Volumes détachés du compte (coût de stockage) :"
            echo '```'
            aws ec2 describe-volumes --filters Name=status,Values=available \
              --query 'Volumes[].[VolumeId,Size,CreateTime,Tags[?Key==`Name`]|[0].Value]' --output text || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: "D5 Rapport"
    needs: [preflight, backup, destroy, cleanup]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Récapitulatif
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "# 🧨 Destruction de l'infrastructure LANDOLSI TIRES"
            echo "| Étape | Résultat |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" elif .value.result == "skipped" then "⏭️ ignorée" else "❌ " + .value.result end) |"'
            echo
            echo "Redéployer : **Actions > CI/CD — LANDOLSI TIRES > Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length == 0' >/dev/null
