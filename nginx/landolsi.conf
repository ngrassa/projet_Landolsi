# Nginx : frontend React (fichiers statiques) + reverse proxy vers l'API.
# Installé par scripts/install.sh dans /etc/nginx/sites-available/landolsi
#
#   /              -> frontend/dist (SPA React, fallback index.html)
#   /api/...       -> http://127.0.0.1:5001/... (préfixe /api retiré)
#   /api/uploadPneu/ -> images téléversées servies directement depuis le disque
#
# Même origine pour le site et l'API : pas de CORS, cookie SameSite=Lax OK.
# HTTPS : certbot --nginx ajoute le bloc 443 et la redirection (voir docs).

upstream landolsi_backend {
    server 127.0.0.1:5001;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/landolsi/current/frontend/dist;
    index index.html;

    # Téléversement d'images limité à 5 Mo par multer
    client_max_body_size 6m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/uploadPneu/ { return 404; }
    location /api/uploadPneu/ {
        alias /var/lib/landolsi/uploads/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://landolsi_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le chatbot (Gemini) peut répondre lentement
        proxy_read_timeout 90s;
    }

    # Fichiers Vite avec empreinte : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # index.html ne doit pas être mis en cache (nouveau build = nouvelles empreintes)
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
