# En-têtes de sécurité HTTP communs (inclus dans chaque location de landolsi.conf).
# Installé par scripts/install.sh dans /etc/nginx/snippets/landolsi-security-headers.conf
# Nginx n'hérite pas des add_header du bloc server dans une location qui en définit :
# d'où cet include répété. Constats OWASP ZAP traités : 10038 (CSP), 10063
# (Permissions-Policy), 90004 (CORP), 10035 (HSTS).
#
# CSP : le frontend ne charge aucune ressource externe (liens seulement).
#   data: et blob: = QR code MFA et aperçu des photos téléversées ;
#   'unsafe-inline' pour les styles uniquement (Bootstrap, attributs style React).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Ignoré par les navigateurs en HTTP ; actif dès que certbot a activé HTTPS
add_header Strict-Transport-Security "max-age=31536000" always;
